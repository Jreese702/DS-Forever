<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS Forever bridge test</title>
<style>
  :root { --bg:#14161a; --fg:#e8e6e1; --muted:#9a978f; --accent:#e0b04a; --ok:#6fbf73; --bad:#e06a5a; --panel:#1d2026; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, Segoe UI, sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; } p { margin:4px 0 12px; color:var(--muted); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  input { background:var(--panel); color:var(--fg); border:1px solid #333; border-radius:6px; padding:6px 8px; font:inherit; width:9em; letter-spacing:.15em; }
  button { background:var(--accent); color:#1a1a1a; border:0; border-radius:6px; padding:7px 12px; font:inherit; font-weight:600; cursor:pointer; }
  button.secondary { background:var(--panel); color:var(--fg); border:1px solid #333; }
  .stat { background:var(--panel); border-radius:8px; padding:8px 12px; min-width:8em; }
  .stat b { display:block; font-size:20px; }
  pre { background:var(--panel); border-radius:8px; padding:10px; overflow:auto; max-height:45vh; white-space:pre-wrap; word-break:break-all; font-size:12px; }
  #state.ok { color:var(--ok); } #state.bad { color:var(--bad); }
</style>
</head>
<body>
<h1>DS Forever bridge test</h1>
<p>This PC only. Pair with the code shown in DS Forever Desktop (the test page skips the stream pairing), then watch the add-on's documents arrive live.</p>
<div class="row">
  <input id="code" inputmode="numeric" maxlength="7" placeholder="123 456" autocomplete="off">
  <button id="pair">Pair</button>
  <button id="connect" class="secondary">Connect with saved token</button>
  <button id="forget" class="secondary">Forget token</button>
  <span id="state">not connected</span>
</div>
<div class="row">
  <div class="stat"><span>Documents</span><b id="docs">0</b></div>
  <div class="stat"><span>Backlog</span><b id="backlog">-</b></div>
  <div class="stat"><span>Gaps</span><b id="gaps">0</b></div>
  <div class="stat"><span>Last doc</span><b id="last">-</b></div>
</div>
<h1>Latest document</h1>
<pre id="doc">-</pre>
<h1>Messages</h1>
<pre id="log"></pre>
<script>
(() => {
  // docs/STREAM_BRIDGE_PROTOCOL.md v1, as the Thor speaks it
  const $ = id => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
                  del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  let deviceId = store.get('dsf.test.device');
  if (!deviceId) { deviceId = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join(''); store.set('dsf.test.device', deviceId); }
  let ws = null, docs = 0, gaps = 0;
  const say = (s, cls) => { $('state').textContent = s; $('state').className = cls || ''; };
  const log = s => { const l = $('log'); l.textContent = (new Date().toLocaleTimeString() + '  ' + s + '\n' + l.textContent).slice(0, 20000); };
  async function hmac(key, msg) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function open(first) {
    if (ws) ws.close();
    ws = new WebSocket('ws://' + location.host + '/v1/ws');
    ws.onopen = () => ws.send(JSON.stringify(first));
    ws.onclose = e => say('closed (' + e.code + ')', 'bad');
    ws.onmessage = async ev => {
      const m = JSON.parse(ev.data);
      if (m.t === 'doc') {
        docs++; $('docs').textContent = docs; $('last').textContent = new Date().toLocaleTimeString();
        try { $('doc').textContent = JSON.stringify(JSON.parse(m.doc), null, 1).slice(0, 6000); } catch (e) { $('doc').textContent = m.doc; }
        return;
      }
      log(ev.data.slice(0, 400));
      if (m.t === 'pair_challenge') {
        const code = $('code').value.replace(/\D/g, '');
        ws.send(JSON.stringify({ t: 'pair_proof', proof: await hmac(code, 'dsf-pair-v1|' + m.nonce + '|' + deviceId) }));
      } else if (m.t === 'pair_ok') { store.set('dsf.test.token', m.token); }
      else if (m.t === 'pair_error') say('pairing refused: ' + m.error, 'bad');
      else if (m.t === 'welcome') { say('connected to ' + (m.pc_name || 'PC'), 'ok'); $('backlog').textContent = m.backlog; }
      else if (m.t === 'gap') { gaps++; $('gaps').textContent = gaps; }
      else if (m.t === 'log') { docs = 0; $('docs').textContent = 0; }
      else if (m.t === 'error') say('error: ' + m.error, 'bad');
    };
  }
  $('pair').onclick = () => open({ t: 'pair_hello', proto: 1, device_id: deviceId, name: 'Bridge test page', stream: false });
  $('connect').onclick = () => {
    const token = store.get('dsf.test.token');
    if (!token) { say('no saved token: pair first', 'bad'); return; }
    open({ t: 'hello', proto: 1, device_id: deviceId, token });
  };
  $('forget').onclick = () => { store.del('dsf.test.token'); say('token forgotten'); };
  if (store.get('dsf.test.token')) $('connect').onclick();
})();
</script>
</body>
</html>
